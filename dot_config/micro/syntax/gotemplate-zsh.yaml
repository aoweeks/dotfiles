---
filetype: "gotemplate-zsh"

detect:
  filename: "dot_zshrc\\.tmpl$"

# Include all the base TOML highlighting rules first!
include: "zsh"

# Then overlay the Go Template rules on top
rules:
  - constant.string:
      start: "{{"
      end: "}}"
  - statement:
      match: "\\b(if|else|end|range|with|define|template)\\b"
